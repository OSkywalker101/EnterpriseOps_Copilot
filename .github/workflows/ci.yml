name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enterpriseops
  DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/enterpriseops
  SECRET_KEY: test-secret-key-for-ci-only-min-32-chars-long
  GROQ_API_KEY: ""
  DEMO_MODE: "true"
  DEBUG: "true"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: enterpriseops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt

      - name: Run database migrations
        working-directory: ./backend
        run: |
          alembic upgrade head

      - name: Run backend tests
        working-directory: ./backend
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

      - name: Run type checking
        working-directory: ./backend
        run: |
          mypy app/ --ignore-missing-imports

      - name: Run linting
        working-directory: ./backend
        run: |
          ruff check app/

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run type checking
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      - name: Run linting
        working-directory: ./frontend
        run: |
          npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: enterpriseops/backend:latest
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: enterpriseops/frontend:latest
          load: true

      - name: Test docker compose
        run: |
          docker compose config